<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quiz Arena 07</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { margin: 0; background: radial-gradient(circle, #1e293b, #0f172a); color: white; font-family: sans-serif; text-align: center; }
        .screen { padding-top: 20vh; display: none; }
        .active { display: block; }
        .btn { padding: 15px 30px; margin: 10px; border-radius: 25px; border: none; background: #38bdf8; font-weight: bold; cursor: pointer; }
        #timer { font-size: 40px; color: #fbbf24; }
    </style>
</head>
<body>
    <div style="position:absolute; top:10px; width:100%;">
        <button onclick="setLang('en')">English</button>
        <button onclick="setLang('ne')">नेपाली</button>
    </div>

    <div id="login-screen" class="screen active">
        <h1>QUIZ ARENA 07</h1>
        <input id="name" placeholder="Enter name">
        <button class="btn" onclick="enterGame()">Start</button>
    </div>

    <div id="menu-screen" class="screen">
        <button class="btn" onclick="start('solo')">Solo</button>
        <button class="btn" onclick="start('online')">Online</button>
        <button class="btn" onclick="createPrivate()">Create Private</button>
        <button class="btn" onclick="joinPrivate()">Join Private</button>
        <div id="subjects">
            <button onclick="start('Geography')">Geography</button>
            <button onclick="start('History')">History</button>
            <button onclick="start('Sports')">Sports</button>
        </div>
    </div>

    <div id="game-screen" class="screen">
        <div id="timer">10</div>
        <h2 id="q">Question</h2>
        <div id="opts"></div>
    </div>

    <script>
        const socket = io();
        const GEMINI_API_KEY = "AQ.Ab8RN6Kl8hOwRETvUwpGzTDbowgDIFETlAM9MCQPVFHXXOsYKQ"; // <--- ADD YOUR KEY HERE
        let name = '', mode = '', score = 0, time = 10, qIdx = 0, questions = [];

        function setLang(l) { alert('Language: ' + l); }
        function enterGame() { name = document.getElementById('name').value; document.getElementById('login-screen').className = 'screen'; document.getElementById('menu-screen').className = 'screen active'; }
        
        async function start(m) {
            mode = m;
            document.getElementById('menu-screen').className = 'screen';
            document.getElementById('game-screen').className = 'screen active';
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
            const res = await fetch(url, { method: "POST", headers: {"Content-Type": "application/json"}, 
                body: JSON.stringify({contents: [{parts: [{text: `Generate 10 MCQs on ${mode}. JSON: [{"question":"...","options":["A","B","C","D"],"correct":"A"}]`}]}]})});
            const data = await res.json();
            questions = JSON.parse(data.candidates[0].content.parts[0].text.replace(/```json|```/g, ""));
            render();
        }

        function render() {
            let q = questions[qIdx];
            document.getElementById('q').innerText = q.question;
            let opts = document.getElementById('opts'); opts.innerHTML = '';
            q.options.forEach(o => {
                let b = document.createElement('button'); b.className = 'btn'; b.innerText = o;
                b.onclick = () => { if(o === q.correct) score += 10; qIdx++; render(); };
                opts.appendChild(b);
            });
        }
        function createPrivate() { socket.emit('createPrivateRoom', { roomCode: 'ROOM1' }); alert('Room created'); }
        function joinPrivate() { socket.emit('joinPrivateRoom', { roomCode: 'ROOM1' }); alert('Joined'); }
    </script>
</body>
</html>
